# gitleaks configuration.
#
# .gitleaksignore pins exemptions to individual commit fingerprints, which does
# not survive the key arriving again in a new commit — and it is due to, via
# feat/verified-agent-loop (PR #10). This allowlist is keyed on what the value
# actually is instead, so it keeps holding.

[extend]
useDefault = true

[[allowlists]]
description = """
Firebase Web API key in the CLI's Google sign-in flow.

Firebase Web API keys are public by design: they identify the project and
authorise nothing on their own — the same value ships in the web and desktop
client bundles, and google_login.py says so at the definition. Access is
governed by Firebase security rules and API-key restrictions, not by keeping
the value secret, so this is a rule match rather than a disclosed credential.

Scoped to that one file AND to the AIza key shape, so any other secret in that
file, and this shape anywhere else, still fails the scan.

Worth confirming separately that the key's API-key restrictions and Firebase
security rules are actually configured — the value being public only stays
harmless while those are.
"""
condition = "AND"
paths = ['''(^|/)google_login\.py$''']
regexes = ['''AIza[0-9A-Za-z\-_]{35}''']
