name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 4.1.1)"
        required: false

jobs:
  verify-version:
    name: Verify version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyproject / package.json / aria_cli.py must agree with the tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/bump_version.py --check "${{ github.ref_name }}"
          else
            python scripts/bump_version.py --check ${{ github.event.inputs.version }}
          fi

  create-release:
    # 2026-08-20：这个 job 以前不存在，后果是 Releases 页停在 v4.2.0。
    # build-native-binaries.yml 用 `gh release upload <tag>` 附二进制，那条命令
    # 要求 release 已经存在——没有任何一步创建它，于是 v4.2.0 一个产物都没有、
    # v4.3.0 干脆没有 release。这里创建，且刻意排在最前：二进制要构建好几分钟，
    # 等它们跑完时 release 早就在了。
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --generate-notes 需要完整历史才能算出上一次 release 以来的提交
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 幂等：重跑 workflow 或手工先建过都不该失败
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — leaving it as is."
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  publish-npm:
    name: Publish to npmjs.com
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      # The dispatcher lists the platform packages as optionalDependencies.
      # build-native-binaries.yml publishes them from the same tag, in parallel
      # with this workflow, so without waiting the dispatcher can land first —
      # and npm skips an optionalDependency it cannot resolve, silently, leaving
      # anyone who installs in that window with a launcher and no binary.
      #
      # Missing after the timeout is not fatal: that platform's build may have
      # failed, and the dispatcher already reports an absent package by name.
      # A whole release should not be held for one platform.
      - name: Wait for this version's platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          KEYS="darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64"
          DEADLINE=$(( $(date +%s) + 900 ))
          for key in $KEYS; do
            pkg="@artheras/aria-code-${key}@${VERSION}"
            until npm view "$pkg" version >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "::warning::$pkg never appeared; publishing without it"
                break
              fi
              echo "waiting for $pkg …"
              sleep 20
            done
          done

      - name: Publish @artheras/aria-code to npm
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # enables PyPI Trusted Publishing (OIDC) as an alternative
    env:
      # Graceful skip if the token secret isn't configured yet (referencing a
      # secret in env is allowed; referencing one in a job-level `if` is not).
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        if: env.HAS_PYPI_TOKEN == 'true'
        run: uv build

      - name: Check distribution metadata
        if: env.HAS_PYPI_TOKEN == 'true'
        run: uvx twine check dist/*

      # twine check validates metadata and passes happily on a wheel that
      # contains nothing else. A misconfigured packages.find made exactly that:
      # six metadata entries, zero modules, 7 KB against the 1.75 MB that 4.4.2
      # published — an install that succeeds and then fails on `import
      # aria_code`. Since the token was unset the release skipped and it never
      # shipped, which was luck, not a gate.
      - name: The distribution must actually contain the package
        if: env.HAS_PYPI_TOKEN == 'true'
        shell: bash
        run: |
          python - <<'CHECK'
          import pathlib, sys, tarfile, zipfile

          MIN_MODULES = 100
          problems = []

          for wheel in pathlib.Path("dist").glob("*.whl"):
              names = zipfile.ZipFile(wheel).namelist()
              modules = [n for n in names if n.startswith("aria_code/") and n.endswith(".py")]
              print(f"{wheel.name}: {len(modules)} modules")
              if len(modules) < MIN_MODULES:
                  problems.append(f"{wheel.name} holds {len(modules)} aria_code modules")
              for needed in ("aria_code/aria_cli.py", "aria_code/apps/cli/main.py"):
                  if needed not in names:
                      problems.append(f"{wheel.name} is missing {needed}")

          for sdist in pathlib.Path("dist").glob("*.tar.gz"):
              with tarfile.open(sdist) as tar:
                  modules = [n for n in tar.getnames()
                             if "/src/aria_code/" in n and n.endswith(".py")]
              print(f"{sdist.name}: {len(modules)} modules")
              if len(modules) < MIN_MODULES:
                  problems.append(f"{sdist.name} holds {len(modules)} aria_code modules")

          if not list(pathlib.Path("dist").glob("*")):
              problems.append("dist/ is empty — nothing was built")

          if problems:
              print("\nRefusing to publish:")
              for p in problems:
                  print(f"  - {p}")
              print("\nCheck [tool.setuptools.packages.find] where in pyproject.toml.")
              sys.exit(1)
          print("\nOK: the distribution contains the package")
          CHECK

      - name: Publish to PyPI
        if: env.HAS_PYPI_TOKEN == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Skipped notice
        if: env.HAS_PYPI_TOKEN != 'true'
        run: echo "PYPI_API_TOKEN secret not set — skipping PyPI publish. Add it in repo Settings → Secrets, or configure PyPI Trusted Publishing."

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@artherahq"

      - name: Prepare scoped package for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@artherahq/aria-code';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com/', access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
        working-directory: npm

      - name: Publish @artherahq/aria-code to GitHub Packages
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
